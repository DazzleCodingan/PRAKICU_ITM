name: Prakiraan Cuaca Harian

on:
  schedule:
    # 22:43 UTC = 05:43 WIB (lebih awal agar tetap sampai sekitar 06:30 WIB walau GitHub telat)
    - cron: "43 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prakiraan-cuaca
  cancel-in-progress: false

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log waktu eksekusi
        run: echo "event=${{ github.event_name }} jadwal=${{ github.event.schedule }} mulai=$(date -u)"

      - name: Keepalive (cegah jadwal dinonaktifkan)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch forecast data
        run: python EKSTRAK.py

      - name: Generate forecast image
        run: python POSISI.py

      - name: Email forecast
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python KIRIM_EMAIL.py
