name: Prakiraan Cuaca Harian

on:
  schedule:
    # 23:27 UTC = 06:27 WIB
    - cron: "27 23 * * *"
  workflow_dispatch:

concurrency:
  group: prakiraan-cuaca
  cancel-in-progress: false

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch forecast data
        run: python EKSTRAK.py

      - name: Generate forecast image
        run: python POSISI.py

      - name: Email forecast
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python KIRIM_EMAIL.py
