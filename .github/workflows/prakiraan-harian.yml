name: Prakiraan Cuaca Harian

on:
  schedule:
    # 22:43 UTC = 05:43 WIB (lebih awal agar tetap sampai sekitar 06:30 WIB walau GitHub telat)
    - cron: "43 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prakiraan-cuaca
  cancel-in-progress: false

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    # Batas atas: 3 langkah x 3 percobaan x 5 menit = 45 menit + setup
    timeout-minutes: 50
    steps:
      - name: Log waktu eksekusi
        run: echo "event=${{ github.event_name }} jadwal=${{ github.event.schedule }} mulai=$(date -u)"

      - name: Keepalive (cegah jadwal dinonaktifkan)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch forecast data
        run: |
          for i in 1 2 3; do
            echo "EKSTRAK.py percobaan $i/3 - $(date -u)"
            if timeout -k 10 300 python -u EKSTRAK.py; then
              exit 0
            fi
            echo "Gagal atau lewat 5 menit, diulang paksa..."
            sleep 5
          done
          echo "EKSTRAK.py gagal setelah 3 percobaan"
          exit 1

      - name: Generate forecast image
        run: |
          for i in 1 2 3; do
            echo "POSISI.py percobaan $i/3 - $(date -u)"
            if timeout -k 10 300 python -u POSISI.py; then
              exit 0
            fi
            echo "Gagal atau lewat 5 menit, diulang paksa..."
            sleep 5
          done
          echo "POSISI.py gagal setelah 3 percobaan"
          exit 1

      - name: Email forecast
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          for i in 1 2 3; do
            echo "KIRIM_EMAIL.py percobaan $i/3 - $(date -u)"
            if timeout -k 10 300 python -u KIRIM_EMAIL.py; then
              exit 0
            fi
            echo "Gagal atau lewat 5 menit, diulang paksa..."
            sleep 5
          done
          echo "KIRIM_EMAIL.py gagal setelah 3 percobaan"
          exit 1
